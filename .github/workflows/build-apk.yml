name: 构建安装包

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "kids-launcher/**"
      - ".github/workflows/build-apk.yml"
  pull_request:
    branches:
      - main
    paths:
      - "kids-launcher/**"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: false

jobs:
  apk:
    name: 生成可安装包
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: ${{ github.workspace }}/android-sdk
      ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk
    steps:
      - name: 取出源代码
        uses: actions/checkout@v4

      - name: 安装 Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: 安装 Android SDK
        run: |
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl -fsSL -o /tmp/cmdtools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          rm -rf /tmp/cmdline-tools
          unzip -q /tmp/cmdtools.zip -d /tmp
          mv /tmp/cmdline-tools "$ANDROID_HOME/cmdline-tools/latest"
          set +o pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" --licenses >/dev/null || true
          set -o pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" "platforms;android-34" "build-tools;34.0.0"

      - name: 检查签名库解析
        run: python3 kids-launcher/ci/test_materialize_keystore.py

      - name: 写入签名配置
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: python3 kids-launcher/ci/materialize_keystore.py

      - name: 构建正式安装包
        working-directory: kids-launcher
        run: |
          test "$ANDROID_HOME" = "$ANDROID_SDK_ROOT"
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties
          chmod +x ./gradlew && ./gradlew :core:test :app:assembleRelease --no-daemon

      - name: 检查签名并定名
        run: |
          cp kids-launcher/app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/kids-desktop.apk"
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify "$RUNNER_TEMP/kids-desktop.apk"
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging "$RUNNER_TEMP/kids-desktop.apk" | grep -E "package:|sdkVersion|targetSdk|application-label"

      - name: 上传本次构建结果
        uses: actions/upload-artifact@v4
        with:
          name: kids-desktop
          path: ${{ runner.temp }}/kids-desktop.apk
          retention-days: 90
          if-no-files-found: error

      - name: 发布到 Releases
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(sha256sum "$RUNNER_TEMP/kids-desktop.apk" | awk '{print $1}')
          url="https://github.com/${GITHUB_REPOSITORY}/releases/download/apk/kids-desktop.apk"
          cat > "$RUNNER_TEMP/notes.md" <<EOF
          由 GitHub Actions 按当前源代码构建。

          - 提交：${GITHUB_SHA}
          - SHA-256：${sha}

          下载：${url}
          EOF
          gh release delete apk --yes --cleanup-tag || true
          created=0
          for _ in 1 2 3 4 5; do
            if gh release create apk "$RUNNER_TEMP/kids-desktop.apk" \
              --target "$GITHUB_SHA" \
              --title "儿童桌面安装包" \
              --latest \
              --notes-file "$RUNNER_TEMP/notes.md"; then
              created=1
              break
            fi
            gh release delete apk --yes --cleanup-tag || true
            sleep 5
          done
          test "$created" -eq 1
          {
            echo "### 安装包"
            echo "$url"
            echo ""
            echo "SHA-256 \`${sha}\`"
          } >> "$GITHUB_STEP_SUMMARY"
