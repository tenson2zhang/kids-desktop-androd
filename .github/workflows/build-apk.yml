name: 构建安装包

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "kids-launcher/**"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: false

jobs:
  apk:
    name: 生成可安装包
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: ${{ github.workspace }}/android-sdk
    steps:
      - name: 取出源代码
        uses: actions/checkout@v4

      - name: 安装 Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: 安装 Android SDK
        run: |
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl -fsSL -o /tmp/cmdtools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          rm -rf /tmp/cmdline-tools
          unzip -q /tmp/cmdtools.zip -d /tmp
          mv /tmp/cmdline-tools "$ANDROID_HOME/cmdline-tools/latest"
          set +o pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" --licenses >/dev/null || true
          set -o pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" "platforms;android-34" "build-tools;34.0.0"

      - name: 写入签名配置
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          python3 - <<'PY'
          import base64
          import os
          import sys
          from pathlib import Path

          def prop(value: str) -> str:
              return (
                  value.replace("\\", "\\\\")
                  .replace("\n", "\\n")
                  .replace("\r", "\\r")
                  .replace("=", "\\=")
                  .replace(":", "\\:")
                  .replace("#", "\\#")
                  .replace("!", "\\!")
              )

          encoded = "".join(os.environ.get("ANDROID_KEYSTORE_BASE64", "").split())
          store_password = os.environ.get("ANDROID_KEYSTORE_PASSWORD", "")
          if not encoded or not store_password:
              print(
                  "::error::缺少签名密钥。请到仓库 Settings → Secrets and variables → Actions，"
                  "添加 ANDROID_KEYSTORE_BASE64 和 ANDROID_KEYSTORE_PASSWORD，然后重新运行「构建安装包」。",
                  file=sys.stderr,
              )
              sys.exit(1)

          try:
              keystore_bytes = base64.b64decode(encoded, validate=True)
          except Exception:
              print(
                  "::error::ANDROID_KEYSTORE_BASE64 不是有效的 Base64。请重新粘贴 kids-desktop.jks 的 Base64。",
                  file=sys.stderr,
              )
              sys.exit(1)

          keystore = Path("kids-launcher/keystore/kids-desktop.jks")
          keystore.parent.mkdir(parents=True, exist_ok=True)
          keystore.write_bytes(keystore_bytes)
          keystore.chmod(0o600)

          alias = os.environ.get("ANDROID_KEY_ALIAS") or "kidsdesktop"
          key_password = os.environ.get("ANDROID_KEY_PASSWORD") or store_password
          Path("kids-launcher/keystore.properties").write_text(
              "storeFile=keystore/kids-desktop.jks\n"
              f"storePassword={prop(store_password)}\n"
              f"keyAlias={prop(alias)}\n"
              f"keyPassword={prop(key_password)}\n",
              encoding="utf-8",
          )
          PY

      - name: 构建正式安装包
        working-directory: kids-launcher
        run: chmod +x ./gradlew && ./gradlew :core:test :app:assembleRelease --no-daemon

      - name: 检查签名并定名
        run: |
          cp kids-launcher/app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/kids-desktop.apk"
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify "$RUNNER_TEMP/kids-desktop.apk"
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging "$RUNNER_TEMP/kids-desktop.apk" | grep -E "package:|sdkVersion|targetSdk|application-label"

      - name: 上传本次构建结果
        uses: actions/upload-artifact@v4
        with:
          name: kids-desktop
          path: ${{ runner.temp }}/kids-desktop.apk
          retention-days: 90
          if-no-files-found: error

      - name: 发布到 Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(sha256sum "$RUNNER_TEMP/kids-desktop.apk" | awk '{print $1}')
          url="https://github.com/${GITHUB_REPOSITORY}/releases/download/apk/kids-desktop.apk"
          cat > "$RUNNER_TEMP/notes.md" <<EOF
          由 GitHub Actions 按当前源代码构建。

          - 提交：${GITHUB_SHA}
          - SHA-256：${sha}

          下载：${url}
          EOF
          gh release delete apk --yes --cleanup-tag || true
          created=0
          for _ in 1 2 3 4 5; do
            if gh release create apk "$RUNNER_TEMP/kids-desktop.apk" \
              --target "$GITHUB_SHA" \
              --title "儿童桌面安装包" \
              --latest \
              --notes-file "$RUNNER_TEMP/notes.md"; then
              created=1
              break
            fi
            gh release delete apk --yes --cleanup-tag || true
            sleep 5
          done
          test "$created" -eq 1
          {
            echo "### 安装包"
            echo "$url"
            echo ""
            echo "SHA-256 \`${sha}\`"
          } >> "$GITHUB_STEP_SUMMARY"
